[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ajlab"
description = "Agent ready JupyterLab"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Jeremy Tuloup" },
]
keywords = ["jupyter", "jupyterlab", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "jupyterlab>=4.6.1",
    "jupyter-docprovider>=3.0.0a0",
    "jupyter-server-mcp>=0.3.0a0",
    "jupyter-server-ydoc>=3.0.0a0",
    "jupyterlab-commands-toolkit>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/jtpio/ajlab"
Repository = "https://github.com/jtpio/ajlab"
Issues = "https://github.com/jtpio/ajlab/issues"

[tool.hatch.version]
path = "src/ajlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ajlab"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/labconfig" = "etc/jupyter/labconfig"
"jupyter-config/jupyter_server_config.json" = "etc/jupyter/jupyter_server_config.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/jupyter-config",
    "/LICENSE",
    "/pyproject.toml",
]
